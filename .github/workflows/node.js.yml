# Lints and builds the app on every push and pull request to main and stage.

name: Node.js CI

on:
  push:
    branches: ["main", "stage"]
  pull_request:
    branches: ["main", "stage"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Next.js 16 needs Node.js 20.9 or newer.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
